- block_id: B5-improvements
  title: 'Mejora M-001: Eliminar rutas hardcodeadas y crear framework de configuración'
  description: ''
  questions:
  - id: Q-M-001
    text: 'Propuesta: Eliminar rutas hardcodeadas y crear framework de configuración.
      ¿Qué decides?'
    question_type: approval
    required: true
    options:
    - Aprobar
    - Rechazar
    - Explicar más
    source_finding: ''
    context: ''
    recommended_default: Aprobar
    evidence:
    - 'problema: Se detectaron 21 nodos con rutas absolutas hardcodeadas a `/sasdata/BCCH/GEM_DCNI/...`.
      Evidencia: CS-0001 (CodeTask-1luvy2zX48vyTm18), CS-0005 (CodeTask-1MZt2MbPkdLUOvbC),
      CS-0010 (CodeTask-6NFJPkCu6mSpiJT9), CS-0013 (CodeTask-6SjSzoc2tRAmj3bg), CS-0020
      (CodeTask-a5fupJ8fUrKfjLpj), CS-0025 (CodeTask-b4yKCgjI7DEeqndl), CS-0033 (CodeTask-dYzl6IKuUE5lnGRx),
      CS-0038 (CodeTask-eEgfNiAdcXrWGWaj), CS-0043 (CodeTask-EiTHWvhqkY9b3Los), CS-0053
      (CodeTask-ifAGwBWSiFAQtKqB), CS-0063 (CodeTask-KbgIzRrZ11b3kVse), CS-0072 (CodeTask-LbbQOdnOflsfHI1p),
      CS-0078 (CodeTask-lVG5feJnCetjgbtL), CS-0082 (CodeTask-M7Kq8x8xCBjt8NWW), CS-0095
      (CodeTask-PctehnQmgLccQ4yN), CS-0103 (CodeTask-PV6f6Wo5zpk123T2), CS-0111 (CodeTask-rVgcAFrUWf36VVj6),
      CS-0125 (CodeTask-uEJMdbfEYJHVR2af), CS-0128 (CodeTask-uRMT7rfFsM7wFmZJ), CS-0137
      (CodeTask-XkoygblbmDJ46M1C), CS-0138 (CodeTask-yh5u6Xv3BMVagLtW). Impacta portabilidad,
      debugging y cambios de entorno.'
    - impacto high · esfuerzo high · riesgo medium
    - afecta 21 nodo(s)
    - 'justificación: Las rutas hardcodeadas impiden reutilización de código en entornos
      de desarrollo, testing y producción. Imposibilita migración de datos o cambios
      en infraestructura sin editar múltiples nodos. Genera deuda técnica crítica.'
  - id: Q-M-003
    text: 'Propuesta: Extraer expresiones CASE repetidas a funciones/macros reutilizables.
      ¿Qué decides?'
    question_type: approval
    required: true
    options:
    - Aprobar
    - Rechazar
    - Explicar más
    source_finding: ''
    context: ''
    recommended_default: Aprobar
    evidence:
    - 'problema: Se detectaron 6 expresiones CASE complejas repetidas en 25 nodos
      con similar patrón de inversión de signos: ''CASE WHEN T1.C_ENTRADA=''D'' THEN
      T1.DATO*-1 ELSE T1.DATO END'' (25 nodos), ''CASE WHEN T1.C_ENTRADA=''H'' THEN
      T1.DATO*-1 ELSE T1.DATO END'' (16 nodos), ''CASE WHEN T1.C_CUENTA=''REC PRECIO
      REAJ'' THEN ''REC PRECIO'' ELSE T1.C_CUENTA END'' (8 nodos). Evidencia: repeated_expressions
      en analysis_evidence, node_ids: CodeTask-2Qnp37e99kvQSM9m, CodeTask-6SjSzoc2tRAmj3bg,
      CodeTask-Ix7ilK7RK3FKfDEH, CodeTask-KbHRFnaoSR2Bq6wI (y 21 más).'
    - impacto high · esfuerzo medium · riesgo medium
    - afecta 25 nodo(s)
    - 'justificación: La repetición de lógica CASE compleja aumenta complejidad cognitiva,
      introduce riesgo de errores de copia-pega, y dificulta cambios en reglas de
      negocio. Centralizar en macro/función facilita auditoría y mantenimiento.'
  - id: Q-M-004
    text: 'Propuesta: Eliminar números mágicos y definir constantes nombradas. ¿Qué
      decides?'
    question_type: approval
    required: true
    options:
    - Aprobar
    - Rechazar
    - Explicar más
    source_finding: ''
    context: ''
    recommended_default: Aprobar
    evidence:
    - 'problema: Se detectaron 18 números mágicos reiterados sin documentación: 511
      (27 nodos), 321 (27 nodos), 1000 (24 nodos), 51022 (23 nodos), 51021 (22 nodos),
      5101 (20 nodos), 3390101 (20 nodos), 3390102 (20 nodos), 339011 (17 nodos),
      341 (17 nodos), 412 (16 nodos), 334 (15 nodos), 33901 (15 nodos), 322 (15 nodos),
      352 (14 nodos), 411 (14 nodos), 331 (13 nodos), 361 (13 nodos). Evidencia: repeated_magic_numbers
      en analysis_evidence. Estos valores se infieren como códigos de sector/producto/instrumento
      según contexto BD_CTSI.'
    - impacto high · esfuerzo medium · riesgo low
    - afecta 35 nodo(s)
    - 'justificación: Los números mágicos sin significado explícito impiden comprensión
      del código, facilitan errores de transcripción, y complican cambios en clasificaciones
      (si sector 511 cambia de código, impacta múltiples nodos). Usar constantes con
      nombre semántico (ej: SECTOR_SOCIEDADES_NO_FINANCIERAS = 511) mejora legibilidad
      y mantenibilidad.'
  - id: Q-M-006
    text: 'Propuesta: Revisar y documentar dependencias de variables macro. ¿Qué decides?'
    question_type: approval
    required: true
    options:
    - Aprobar
    - Rechazar
    - Explicar más
    source_finding: ''
    context: ''
    recommended_default: Aprobar
    evidence:
    - 'problema: Se detectaron 12 variables macro con scope incorrecto/no documentado:
      ANIO (18 nodos), Sector (9 nodos), TRIM (6 nodos), Entrada (4 nodos), C_WTW
      (4 nodos), user (3 nodos), password (3 nodos), Codigo (3 nodos), Cuenta (2 nodos),
      rho (1 nodo), anio (1 nodo), Inst_nf (1 nodo). Evidencia: macro_variables en
      analysis_evidence. Nodos críticos: CodeTask-2Qnp37e99kvQSM9m (ANIO), CodeTask-LbbQOdnOflsfHI1p
      (ANIO, Sector), CodeTask-Lf2OAAam1xLYVxj4 (ANIO, C_WTW), CodeTask-6NFJPkCu6mSpiJT9
      (user, password).'
    - impacto high · esfuerzo medium · riesgo high
    - afecta 26 nodo(s)
    - 'justificación: Las variables macro sin inicialización explícita en autoexec
      o en llamada hacen código no reproducible. Diferentes ejecutores obtienen resultados
      distintos. Credenciales (user, password) en macro variables exponen seguridad.
      Se requiere declaración centralizada, inicialización condicional y documentación
      de alcance.'
  - id: Q-M-007
    text: 'Propuesta: Versionar datos de entrada y crear catálogo de dependencias
      de tablas. ¿Qué decides?'
    question_type: approval
    required: true
    options:
    - Aprobar
    - Rechazar
    - Explicar más
    source_finding: ''
    context: ''
    recommended_default: Aprobar
    evidence:
