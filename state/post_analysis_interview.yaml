- block_id: B5-improvements
  title: 'Mejora M-001: Eliminar rutas de archivo hardcodeadas'
  description: ''
  questions:
  - id: Q-M-001
    text: 'Propuesta: Eliminar rutas de archivo hardcodeadas. ¿Qué decides?'
    question_type: approval
    required: true
    options:
    - Aprobar
    - Rechazar
    - Explicar más
    source_finding: ''
    context: ''
    recommended_default: Aprobar
    evidence:
    - 'problema: Se han identificado 22 instancias de rutas absolutas hardcodeadas
      en nodos críticos: CS-0001 (CodeTask-1luvy2zX48vyTm18), CS-0005 (CodeTask-1MZt2MbPkdLUOvbC),
      CS-0013 (CodeTask-6SjSzoc2tRAmj3bg), CS-0020 (CodeTask-a5fupJ8fUrKfjLpj), CS-0025
      (CodeTask-b4yKCgjI7DEeqndl), CS-0033 (CodeTask-dYzl6IKuUE5lnGRx), CS-0038/CS-0138
      (CodeTask-eEgfNiAdcXrWGWaj, CodeTask-yh5u6Xv3BMVagLtW), CS-0043 (CodeTask-EiTHWvhqkY9b3Los),
      CS-0053 (CodeTask-ifAGwBWSiFAQtKqB), CS-0063 (CodeTask-KbgIzRrZ11b3kVse), CS-0072
      (CodeTask-LbbQOdnOflsfHI1p), CS-0078 (CodeTask-lVG5feJnCetjgbtL), CS-0082 (CodeTask-M7Kq8x8xCBjt8NWW),
      CS-0095/CS-0111 (CodeTask-PctehnQmgLccQ4yN, CodeTask-rVgcAFrUWf36VVj6), CS-0103/CS-0125
      (CodeTask-PV6f6Wo5zpk123T2, CodeTask-uEJMdbfEYJHVR2af), CS-0120 (CodeTask-sQvjLjeo2WC15iXs),
      CS-0128 (CodeTask-uRMT7rfFsM7wFmZJ), CS-0137 (CodeTask-XkoygblbmDJ46M1C). Ejemplos:
      ''/sasdata/BCCH/GEM_DCNI/02_CNSI/02_PRE_SINTESIS/BD_CTSI_CIERRE.sas7bdat'',
      ''/sasdata/BCCH/GEM_DCNI/02_CNSI/05_DCV/Data/DCVRES/t_aj_cd_321_6_af32.sas7bdat''.'
    - impacto high · esfuerzo high · riesgo medium
    - afecta 21 nodo(s)
    - 'justificación: Las rutas hardcodeadas impiden portabilidad entre entornos,
      complican el mantenimiento y generan duplicación de configuración. Un cambio
      de estructura de directorios requiere editar múltiples nodos. El refactoring
      a macro variables centralizadas mejora la trazabilidad y reduce el riesgo de
      inconsistencias.'
  - id: Q-M-006
    text: 'Propuesta: Externalizar credenciales hardcodeadas en PROC HTTP. ¿Qué decides?'
    question_type: approval
    required: true
    options:
    - Aprobar
    - Rechazar
    - Explicar más
    source_finding: ''
    context: ''
    recommended_default: Aprobar
    evidence:
    - 'problema: Se han identificado credenciales en texto plano en 3 nodos: CodeTask-6NFJPkCu6mSpiJT9
      (Program), CodeTask-PctehnQmgLccQ4yN (Program), CodeTask-rVgcAFrUWf36VVj6 (S1).
      Fragmento: ''PROC HTTP URL = "https://si3.bcentral.cl/SieteRestWS/SieteRestWS.ashx?user=&user%bquote(&)pass=&password%bquote(...)"''.
      Macro variables &user y &password expuestas.'
    - impacto high · esfuerzo medium · riesgo high
    - afecta 3 nodo(s)
    - 'justificación: Las credenciales hardcodeadas o en variables macro legibles
      generan riesgo de seguridad crítico: exposición en logs, control de versiones,
      y acceso no autorizado a datos. Implementar (1) archivo de configuración encriptado,
      (2) lectura desde variable de entorno o bóveda de secretos, (3) auditoría de
      acceso.'
  - id: Q-M-007
    text: 'Propuesta: Documenter y estandarizar variables macro inconsistentes. ¿Qué
      decides?'
    question_type: approval
    required: true
    options:
    - Aprobar
    - Rechazar
    - Explicar más
    source_finding: ''
    context: ''
    recommended_default: Aprobar
    evidence:
    - 'problema: Se han identificado 12 macro variables con inconsistencias de nombrado
      y alcance: (1) ''ANIO'' (18 nodos: CodeTask-2Qnp37e99kvQSM9m, CodeTask-LbbQOdnOflsfHI1p,
      ..., CodeTask-vLMl6RS3eEI64niZ) vs ''anio'' (1 nodo: CodeTask-ifAGwBWSiFAQtKqB)
      — inconsistencia mayúsculas; (2) ''Sector'' (9 nodos) sin definición centralizada;
      (3) ''TRIM'' (6 nodos); (4) ''Entrada'' (4 nodos); (5) ''C_WTW'', ''user'',
      ''password'', ''Codigo'', ''Cuenta'', ''rho'' con baja frecuencia y scopings
      no documentados.'
    - impacto medium · esfuerzo medium · riesgo medium
    - afecta 18 nodo(s)
    - 'justificación: Las macro variables inconsistentes generan fragilidad en reproducibilidad:
      valores por defecto no documentados, confusión entre contextos locales/globales,
      y dificultad en debugging. Crear registry centralizado (ej. MACROVAR_REGISTRY)
      con {VAR_NAME, TYPE, SCOPE, DEFAULT, LAST_MODIFIED, OWNER} mejora trazabilidad
      y facilita auditoría.'
  - id: Q-M-008
    text: 'Propuesta: Verificar y documentar dependencias de bases de datos. ¿Qué
      decides?'
    question_type: approval
    required: true
    options:
    - Aprobar
    - Rechazar
    - Explicar más
    source_finding: ''
    context: ''
    recommended_default: Aprobar
    evidence:
    - 'problema: Se han detectado 4 librerías con estado no verificado (verified_db=false):
      (1) DCNIDATA (8 tablas, 4 nodos): AHORRO_PRE_0, AHORRO_PRE_1, DEUDA_HOGARES,
      DEUDA_HOLDING, FBCF_SF, SALDOS_WTW_SI, SALIDA_WTW_RESUMEN, SALIDA_WTW_RESUMEN_ANT;
      (2) GOBGENER (2 tablas, 1 nodo): CR18_T_SCN_2, EJECUCION; (3) LIB (1 tabla,
      3 nodos): SERIES_OBS; (4) TABLAS (34 tablas, 62 nodos): BD_CTSI (20 nodos),
      T_CONTRAPARTIDAS (19 nodos), T_INSTRUMENTOS (21 nodos), T_SECTORIZACION (20
      nodos), etc. Sin información de engine ni ubicación física.'
    - impacto high · esfuerzo high · riesgo medium
    - afecta 4 nodo(s)
    - 'justificación: Las dependencias no verificadas generan fragilidad: ruptura
      silenciosa si tabla se remueve/renombra, dificultad en rastreo de impacto, y
      falta de gobernanza. Documentar schema (campos, tipos, restricciones), verificar
      existencia en CI/CD, y versionar cambios es crítico para reproducibilidad.'
  answers:
  - question_id: Q-M-001
    value: Rechazar
    answered_at: '2026-08-10T16:07:24.024387Z'
  - question_id: Q-M-006
    value: Aprobar
    answered_at: '2026-08-10T16:07:24.024387Z'
  - question_id: Q-M-007
    value: Aprobar
    answered_at: '2026-08-10T16:07:24.024387Z'
  - question_id: Q-M-008
    value: Aprobar
    answered_at: '2026-08-10T16:07:24.024387Z'
