- block_id: B5-improvements
  title: 'Mejora M-001: Eliminar rutas hardcodeadas mediante variables macro o configuración
    centralizada'
  description: ''
  questions:
  - id: Q-M-001
    text: 'Propuesta: Eliminar rutas hardcodeadas mediante variables macro o configuración
      centralizada. ¿Qué decides?'
    question_type: approval
    required: true
    options:
    - Aprobar
    - Rechazar
    - Explicar más
    source_finding: ''
    context: ''
    recommended_default: Aprobar
    evidence:
    - 'problema: Se detectaron 38 rutas de archivo hardcodeadas distribuidas en 17
      nodos críticos (CodeTask-1luvy2zX48vyTm18, CodeTask-6SjSzoc2tRAmj3bg, CodeTask-PV6f6Wo5zpk123T2,
      CodeTask-uEJMdbfEYJHVR2af, CodeTask-b4yKCgjI7DEeqndl, CodeTask-dYzl6IKuUE5lnGRx,
      CodeTask-eEgfNiAdcXrWGWaj, CodeTask-EiTHWvhqkY9b3Los, CodeTask-ifAGwBWSiFAQtKqB,
      CodeTask-KbgIzRrZ11b3kVse, CodeTask-LbbQOdnOflsfHI1p, CodeTask-lVG5feJnCetjgbtL,
      CodeTask-M7Kq8x8xCBjt8NWW, CodeTask-rVgcAFrUWf36VVj6, CodeTask-PctehnQmgLccQ4yN,
      CodeTask-XkoygblbmDJ46M1C, CodeTask-yh5u6Xv3BMVagLtW). Ejemplos: ''/sasdata/BCCH/GEM_DCNI/02_CNSI/02_PRE_SINTESIS/BD_CTSI_CIERRE.sas7bdat'',
      ''/sasdata/BCCH/GEM_DCNI/02_CNSI/05_DCV/Data/DCVRES/t_aj_cd_321_6_af32.sas7bdat''.
      Esta práctica dificulta mantenimiento, portabilidad y auditoría.'
    - impacto high · esfuerzo high · riesgo medium
    - afecta 20 nodo(s)
    - 'justificación: Las rutas hardcodeadas impiden adaptar el código a cambios de
      infraestructura, generan inconsistencias si se replican scripts y complican
      la trazabilidad. Según análisis: 38 ocurrencias catalogadas como ''error'' en
      17 nodos. Refactorizar a macro variables (ej. &SASDATA_PATH, &DCV_PATH) mejora
      mantenibilidad y reproducibilidad.'
  - id: Q-M-004
    text: 'Propuesta: Centralizar y validar variables macro (ANIO, Sector, TRIM) con
      valores por defecto y documentación. ¿Qué decides?'
    question_type: approval
    required: true
    options:
    - Aprobar
    - Rechazar
    - Explicar más
    source_finding: ''
    context: ''
    recommended_default: Aprobar
    evidence:
    - 'problema: Se detectaron 11 variables macro utilizadas sin validación clara:
      ANIO (18 nodos), Sector (9 nodos), TRIM (6 nodos), Entrada (4), C_WTW (4), user
      (3), password (3), Codigo (3), Cuenta (2), rho (1), anio (1). Ejemplo: &ANIO
      usado en CodeTask-2Qnp37e99kvQSM9m, CodeTask-LbbQOdnOflsfHI1p, ..., CodeTask-vLMl6RS3eEI64niZ
      sin validación de rango. Esto introduce variabilidad y dificulta reproducción
      de runs anteriores.'
    - impacto high · esfuerzo medium · riesgo low
    - afecta 19 nodo(s)
    - 'justificación: Implementar %LET con valores por defecto en autoexec, validación
      explícita (ej. %IF &ANIO < 2000 OR &ANIO > %SYSFUNC(YEAR(%TODAY())) %THEN %ABORT;)
      y logging de parámetros garantiza auditoría y reproducibilidad. Análisis: 11
      macros en 62 nodos = alto riesgo de propagación de errores.'
  answers:
  - question_id: Q-M-001
    value: Rechazar
    answered_at: '2026-08-10T20:19:16.423081Z'
  - question_id: Q-M-004
    value: Aprobar
    answered_at: '2026-08-10T20:19:16.423081Z'
