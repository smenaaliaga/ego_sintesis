- block_id: B5-improvements
  title: 'Mejora M-001: Centralizar rutas de archivos hardcodeadas en macro variables'
  description: ''
  questions:
  - id: Q-M-001
    text: 'Propuesta: Centralizar rutas de archivos hardcodeadas en macro variables.
      ¿Qué decides?'
    question_type: approval
    required: true
    options:
    - Aprobar
    - Rechazar
    - Explicar más
    source_finding: ''
    context: ''
    recommended_default: Aprobar
    evidence:
    - 'problema: Se detectan 38 rutas hardcodeadas distribuidas en 23 nodos (CodeTask-1luvy2zX48vyTm18,
      CodeTask-1MZt2MbPkdLUOvbC, CodeTask-6SjSzoc2tRAmj3bg, CodeTask-a5fupJ8fUrKfjLpj,
      CodeTask-b4yKCgjI7DEeqndl, CodeTask-dYzl6IKuUE5lnGRx, CodeTask-eEgfNiAdcXrWGWaj,
      CodeTask-EiTHWvhqkY9b3Los, CodeTask-ifAGwBWSiFAQtKqB, CodeTask-KbgIzRrZ11b3kVse,
      CodeTask-LbbQOdnOflsfHI1p, CodeTask-lVG5feJnCetjgbtL, CodeTask-M7Kq8x8xCBjt8NWW,
      CodeTask-PctehnQmgLccQ4yN, CodeTask-PV6f6Wo5zpk123T2, CodeTask-rVgcAFrUWf36VVj6,
      CodeTask-sQvjLjeo2WC15iXs, CodeTask-uEJMdbfEYJHVR2af, CodeTask-uRMT7rfFsM7wFmZJ,
      CodeTask-XkoygblbmDJ46M1C, CodeTask-yh5u6Xv3BMVagLtW). Ejemplos: ''/sasdata/BCCH/GEM_DCNI/02_CNSI/02_PRE_SINTESIS/BD_CTSI_CIERRE.sas7bdat'',
      ''/sasdata/BCCH/GEM_DCNI/02_CNSI/05_DCV/Data/DCVRES/t_aj_cd_321_6_af32.sas7bdat''.
      Esto impide cambios rápidos de entorno (desarrollo, prueba, producción).'
    - impacto high · esfuerzo medium · riesgo low
    - afecta 21 nodo(s)
    - 'justificación: La evidencia muestra rutas absolutas repetidas 38 veces. La
      lógica de negocio está acoplada a rutas físicas, bloqueando portabilidad y aumentando
      riesgo de errores en migraciones.'
  - id: Q-M-004
    text: 'Propuesta: Centralizar y documentar macro variables de configuración. ¿Qué
      decides?'
    question_type: approval
    required: true
    options:
    - Aprobar
    - Rechazar
    - Explicar más
    source_finding: ''
    context: ''
    recommended_default: Aprobar
    evidence:
    - 'problema: Se detectan 12 macro variables distribuidas: ANIO (18 nodos), Sector
      (9 nodos), TRIM (6 nodos), Entrada (4 nodos), C_WTW (4 nodos), user (3 nodos),
      password (3 nodos), Codigo (3 nodos), Cuenta (2 nodos), rho (1 nodo), anio (1
      nodo), Inst_nf (1 nodo). Inconsistencia de nomenclatura (ANIO vs anio). No existe
      punto central de definición. Los nodos como CodeTask-rVgcAFrUWf36VVj6 contienen
      variables de autenticación sin ofuscación aparente.'
    - impacto high · esfuerzo high · riesgo high
    - afecta 18 nodo(s)
    - 'justificación: La dispersión de macro variables impide auditoría centralizada
      de cambios y gestión de secretos. Variables de credenciales (user, password)
      en código requieren separación inmediata. Inconsistencias de nombrado generan
      errores silenciosos.'
  - id: Q-R-003
    text: 'Propuesta: Auditar y documentar acceso a URLs hardcodeadas en PROC HTTP.
      ¿Qué decides?'
    question_type: approval
    required: true
    options:
    - Aprobar
    - Rechazar
    - Explicar más
    source_finding: ''
    context: ''
    recommended_default: Aprobar
    evidence:
    - 'problema: Se detectan 3 nodos (CodeTask-6NFJPkCu6mSpiJT9, CodeTask-PctehnQmgLccQ4yN,
      CodeTask-rVgcAFrUWf36VVj6) con URLs: ''https://si3.bcentral.cl/SieteRestWS/SieteRestWS.ashx?user=&user%bquote(&)pass=&password%bquote''.
      Las credenciales están parametrizadas pero la URL es fija. Sin documentación
      de versión de API, cambios en endpoint rompen silenciosamente los nodos.'
    - impacto high · esfuerzo medium · riesgo high
    - afecta 3 nodo(s)
    - 'justificación: Dependencias de API externa requieren versionado y monitoreo.
      URLs hardcodeadas + credenciales en variables de macro generan riesgo de exposición.
      Se requiere archivo de configuración centralizado con URLs por entorno.'
  answers:
  - question_id: Q-M-001
    value: Aprobar
    answered_at: '2026-08-11T15:26:37.290203Z'
  - question_id: Q-M-004
    value: Aprobar
    answered_at: '2026-08-11T15:26:37.290203Z'
  - question_id: Q-R-003
    value: Aprobar
    answered_at: '2026-08-11T15:26:37.290203Z'
