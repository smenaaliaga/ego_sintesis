  title: Versionar datos de entrada y crear catálogo de dependencias de tablas
  description: 'Se detectaron 8 tablas de entrada sin versionado en 62 nodos. Tabla
    crítica BD_CTSI (20+ nodos) referenciada como BD_CTSI_CIERRE.sas7bdat. Otras:
