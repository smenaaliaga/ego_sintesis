- id: M-001
  category: maintainability
  title: Eliminar rutas hardcodeadas mediante variables macro o configuración centralizada
  description: 'Se detectaron 38 rutas de archivo hardcodeadas distribuidas en 17
    nodos críticos (CodeTask-1luvy2zX48vyTm18, CodeTask-6SjSzoc2tRAmj3bg, CodeTask-PV6f6Wo5zpk123T2,
    CodeTask-uEJMdbfEYJHVR2af, CodeTask-b4yKCgjI7DEeqndl, CodeTask-dYzl6IKuUE5lnGRx,
    CodeTask-eEgfNiAdcXrWGWaj, CodeTask-EiTHWvhqkY9b3Los, CodeTask-ifAGwBWSiFAQtKqB,
    CodeTask-KbgIzRrZ11b3kVse, CodeTask-LbbQOdnOflsfHI1p, CodeTask-lVG5feJnCetjgbtL,
    CodeTask-M7Kq8x8xCBjt8NWW, CodeTask-rVgcAFrUWf36VVj6, CodeTask-PctehnQmgLccQ4yN,
    CodeTask-XkoygblbmDJ46M1C, CodeTask-yh5u6Xv3BMVagLtW). Ejemplos: ''/sasdata/BCCH/GEM_DCNI/02_CNSI/02_PRE_SINTESIS/BD_CTSI_CIERRE.sas7bdat'',
    ''/sasdata/BCCH/GEM_DCNI/02_CNSI/05_DCV/Data/DCVRES/t_aj_cd_321_6_af32.sas7bdat''.
    Esta práctica dificulta mantenimiento, portabilidad y auditoría.'
  justification: 'Las rutas hardcodeadas impiden adaptar el código a cambios de infraestructura,
    generan inconsistencias si se replican scripts y complican la trazabilidad. Según
    análisis: 38 ocurrencias catalogadas como ''error'' en 17 nodos. Refactorizar
    a macro variables (ej. &SASDATA_PATH, &DCV_PATH) mejora mantenibilidad y reproducibilidad.'
  impact: high
  effort: high
  risk: medium
  recommendation: approve
