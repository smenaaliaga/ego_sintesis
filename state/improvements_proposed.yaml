- id: M-003
  category: quality
  title: Extraer expresiones CASE repetidas a funciones/macros reutilizables
  description: 'Se detectaron 6 expresiones CASE complejas repetidas en 25 nodos con
    similar patrón de inversión de signos: ''CASE WHEN T1.C_ENTRADA=''D'' THEN T1.DATO*-1
    ELSE T1.DATO END'' (25 nodos), ''CASE WHEN T1.C_ENTRADA=''H'' THEN T1.DATO*-1
    ELSE T1.DATO END'' (16 nodos), ''CASE WHEN T1.C_CUENTA=''REC PRECIO REAJ'' THEN
    ''REC PRECIO'' ELSE T1.C_CUENTA END'' (8 nodos). Evidencia: repeated_expressions
    en analysis_evidence, node_ids: CodeTask-2Qnp37e99kvQSM9m, CodeTask-6SjSzoc2tRAmj3bg,
    CodeTask-Ix7ilK7RK3FKfDEH, CodeTask-KbHRFnaoSR2Bq6wI (y 21 más).'
  justification: La repetición de lógica CASE compleja aumenta complejidad cognitiva,
    introduce riesgo de errores de copia-pega, y dificulta cambios en reglas de negocio.
    Centralizar en macro/función facilita auditoría y mantenimiento.
  impact: high
  effort: medium
  risk: medium
  recommendation: approve
