- id: M-002
  category: maintainability
  title: Refactorizar componentes gráficos duplicados en SAS PROC GPLOT
  description: 'Se detectaron 8 bloques de código gráfico idénticos repetidos en 3
    nodos (CodeTask-Ns4cmh4hITlllpAk, CodeTask-TkgG8t5JCMJVDoVb, CodeTask-ie1zFOWtqc6EvbAr):
    SYMBOL1 INTERPOL=JOIN, VLINE PERIODO RESPONSE, VBAR DELTA, XAXIS DISCRETEORDER,
    LEGEND1 FRAME. Evidencia: duplicated_code_blocks en analysis_evidence (node_count:
    3 por bloque, total 8 fragmentos).'
  justification: La duplicación de componentes gráficos dificulta mantenimiento. Cambios
    en estilo gráfico requieren actualizar múltiples ubicaciones, incrementando riesgo
    de inconsistencia.
