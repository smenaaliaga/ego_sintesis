- id: M-003
  category: quality
  title: Encapsular números mágicos y expresiones CASE repetidas en variables o funciones
  description: 'Se encontraron 2 patrones críticos de calidad: 1) Expresión CASE ''CASE
    WHEN T1.C_ENTRADA=\''D\'' THEN T1.DATO*-1 ELSE T1.DATO END'' repetida 25 veces
    en nodos: CodeTask-2Qnp37e99kvQSM9m, CodeTask-6SjSzoc2tRAmj3bg, CodeTask-KbHRFnaoSR2Bq6wI,
    CodeTask-c5JoNhJJnZiM91gN, CodeTask-eEgfNiAdcXrWGWaj, CodeTask-vXwkDE8f2OcjOwky,
    CodeTask-yh5u6Xv3BMVagLtW (y 18 más). 2) Números mágicos sin etiqueta (511, 321,
    1000, 51022, 51021, 5101, 3390101, 3390102, 339011, 341, 412, 334, 33901, 322,
    352, 411, 331, 361, 36912, 36904) distribuidos en 12-27 nodos cada uno. Ambos
    introducen inconsistencias y dificultan auditoría.'
  justification: 'Crear variables de cálculo (%LET SIGN_ADJUSTMENT_D = ...) y constantes
    denominadas (%LET SECTOR_CODIGO_HOLDING = 51022) centraliza definiciones, simplifica
    testing y mejora legibilidad. Análisis: 25 CASE repetidas = 25 puntos de fallo;
    20 números mágicos con alta dispersión = riesgo de desviación.'
  impact: high
  effort: medium
  risk: medium
  recommendation: approve
