    Base de datos TABLAS contiene 34 tablas en 62 nodos. Evidencia: db_dependencies
    en analysis_evidence (libref: DCNIDATA, TABLAS, GOBGENER, LIB).'
  justification: Sin versionado de datos de entrada, ejecuciones en fechas distintas
    producen resultados diferentes. Imposible auditar, reproducir análisis históricos
