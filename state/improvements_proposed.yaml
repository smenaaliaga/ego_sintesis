- id: R-003
  category: reproducibility
  title: Auditar y documentar acceso a URLs hardcodeadas en PROC HTTP
  description: 'Se detectan 3 nodos (CodeTask-6NFJPkCu6mSpiJT9, CodeTask-PctehnQmgLccQ4yN,
