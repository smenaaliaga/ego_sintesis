- id: M-005
  category: quality
  title: Agregar validaciones a UPDATE SQL sin condiciones explícitas
  description: 'Se detectó UPDATE hardcodeado sin cláusula WHERE suficiente: ''UPDATE
    SALDOS_SI SET N_SI_C_AGENTE=''SOCIEDADES NO FINANCIERAS'' WHERE C_SI_C_AGENTE=''S.99''''
    (3 nodos: CodeTask-Lf2OAAam1xLYVxj4, CodeTask-PTl7dbnx3tB9LNaa, CodeTask-vLMl6RS3eEI64niZ).
    Riesgo: actualización masiva sin validación de conteos o rollback.'
  justification: 'La ausencia de condiciones de validación (ej: ''AND AÑO = &ANIO'')
    permite actualizar registros fuera de contexto temporal/sectorial. Cambios en
    tabla SALDOS_SI sin logs auditables incrementan riesgo de corrupción de datos
    históricos.'
  impact: high
  effort: low
  risk: high
  recommendation: approve
  affected_nodes:
