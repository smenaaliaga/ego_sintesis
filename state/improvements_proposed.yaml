- id: M-004
  category: quality
  title: Definir constantes numéricas mágicas en una tabla de control centralizada
  description: 'Se han detectado 18 números mágicos duplicados masivamente: ''511''
    (27 nodos), ''321'' (27 nodos), ''1000'' (24 nodos), ''51022'' (23 nodos), ''51021''
    (22 nodos), ''5101'' (20 nodos), ''3390101'' (20 nodos), ''3390102'' (20 nodos),
    ''339011'' (17 nodos), ''341'' (17 nodos), ''412'' (16 nodos), ''334'' (15 nodos),
    ''33901'' (15 nodos), ''322'' (15 nodos), ''352'' (14 nodos), ''411'' (14 nodos),
    ''331'' (13 nodos), ''361'' (13 nodos). Ejemplos de apariciones: CodeTask-1MZt2MbPkdLUOvbC,
    CodeTask-6SjSzoc2tRAmj3bg, CodeTask-KbgIzRrZ11b3kVse, etc.'
  justification: Los números mágicos (sector codes, account identifiers) reducen legibilidad,
    complican auditoría y generan fragilidad. Un cambio en definición de sectores
    requiere actualizar múltiples nodos sin trazabilidad clara. Crear tabla TCODES
    con {CODE, DESCRIPTION, CATEGORY} e inyectar via PROC SQL centraliza semántica
    y mejora gobernanza.
  impact: high
  effort: high
  risk: medium
  recommendation: approve
