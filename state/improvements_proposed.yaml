- id: M-006
  category: reproducibility
  title: Externalizar credenciales hardcodeadas en PROC HTTP
  description: 'Se han identificado credenciales en texto plano en 3 nodos: CodeTask-6NFJPkCu6mSpiJT9
    (Program), CodeTask-PctehnQmgLccQ4yN (Program), CodeTask-rVgcAFrUWf36VVj6 (S1).
    Fragmento: ''PROC HTTP URL = "https://si3.bcentral.cl/SieteRestWS/SieteRestWS.ashx?user=&user%bquote(&)pass=&password%bquote(...)"''.
    Macro variables &user y &password expuestas.'
  justification: 'Las credenciales hardcodeadas o en variables macro legibles generan
    riesgo de seguridad crítico: exposición en logs, control de versiones, y acceso
    no autorizado a datos. Implementar (1) archivo de configuración encriptado, (2)
    lectura desde variable de entorno o bóveda de secretos, (3) auditoría de acceso.'
  impact: high
  effort: medium
  risk: high
  recommendation: approve
  affected_nodes:
  - CodeTask-6NFJPkCu6mSpiJT9
  - CodeTask-PctehnQmgLccQ4yN
  - CodeTask-rVgcAFrUWf36VVj6
  status: proposed
