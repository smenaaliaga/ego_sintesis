- id: M-006
  category: reproducibility
  title: Revisar y documentar dependencias de variables macro
  description: 'Se detectaron 12 variables macro con scope incorrecto/no documentado:
    ANIO (18 nodos), Sector (9 nodos), TRIM (6 nodos), Entrada (4 nodos), C_WTW (4
    nodos), user (3 nodos), password (3 nodos), Codigo (3 nodos), Cuenta (2 nodos),
    rho (1 nodo), anio (1 nodo), Inst_nf (1 nodo). Evidencia: macro_variables en analysis_evidence.
    Nodos críticos: CodeTask-2Qnp37e99kvQSM9m (ANIO), CodeTask-LbbQOdnOflsfHI1p (ANIO,
    Sector), CodeTask-Lf2OAAam1xLYVxj4 (ANIO, C_WTW), CodeTask-6NFJPkCu6mSpiJT9 (user,
    password).'
  justification: Las variables macro sin inicialización explícita en autoexec o en
    llamada hacen código no reproducible. Diferentes ejecutores obtienen resultados
    distintos. Credenciales (user, password) en macro variables exponen seguridad.
    Se requiere declaración centralizada, inicialización condicional y documentación
    de alcance.
  impact: high
  effort: medium
  risk: high
  recommendation: approve
