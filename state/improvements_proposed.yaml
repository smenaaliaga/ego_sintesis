category_scan_summary:
  maintainability: Se detectaron 83 code smells de maintainability, principalmente
    rutas hardcodeadas (38 instancias en nodos como CodeTask-1luvy2zX48vyTm18, CodeTask-6SjSzoc2tRAmj3bg,
    CodeTask-PV6f6Wo5zpk123T2, CodeTask-uEJMdbfEYJHVR2af, entre otros) y duplicación
    significativa de fragmentos SAS (8 bloques duplicados en 3+ nodos). Se requieren
    2 mejoras correlativas.
  quality: Se identificaron 30 code smells de quality, incluyendo expresiones CASE
    repetidas 25 veces (en CodeTask-2Qnp37e99kvQSM9m, CodeTask-KbHRFnaoSR2Bq6wI y
    23 nodos más) y números mágicos sin encapsular (27 ocurrencias de '511', '321',
    '1000', '51022', etc.). Se propone 1 ficha de mejora.
  reproducibility: Se hallaron 30 code smells de reproducibility, derivados de variables
    macro sin validación (ANIO con 18 usos, Sector con 9, TRIM con 6 en nodos críticos)
    y dependencias de BD no verificadas (DCNIDATA, GOBGENER, TABLAS con 62 tablas
    en total). Se requiere 1 ficha de consolidación.
