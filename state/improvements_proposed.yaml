category_scan_summary:
  maintainability: Se detectan 84 smells de mantenibilidad. Predominan rutas hardcodeadas
    (38 instancias en 23 nodos) que imposibilitan reutilización en diferentes entornos.
    Las mejoras se enfocan en centralizar configuraciones y refactorizar patrones
    de acceso a datos.
  quality: Se detectan 30 smells de calidad. La duplicación masiva de código (5 bloques
    de 3 nodos cada uno, 6 expresiones CASE con 5-25 repeticiones) y números mágicos
    (15 constantes con 12-27 repeticiones) comprometen la confiabilidad y testabilidad.
  reproducibility: Se detectan 31 smells de reproducibilidad. Las dependencias de
    base de datos no verificadas (8 tablas en DCNIDATA, 34 en TABLAS) y variables
    de macro sin centralización (12 variables entre 1-18 nodos) generan fragilidad.
