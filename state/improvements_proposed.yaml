- id: M-005
  category: reproducibility
  title: 'Documentar y verificar dependencias de BD: 62 tablas en 4 librefs (DCNIDATA,
    GOBGENER, LIB, TABLAS) sin validación'
  description: 'El análisis detectó dependencias en 4 librerías sin verificación de
    accesibilidad: DCNIDATA (8 tablas, 4 nodos), GOBGENER (2 tablas, 1 nodo), LIB
    (1 tabla SERIES_OBS, 3 nodos), TABLAS (34 tablas, 62 nodos). Ejemplos: BD_CTSI
    usado en 20 nodos críticos (CodeTask-1MZt2MbPkdLUOvbC, CodeTask-KbHRFnaoSR2Bq6wI,
    CodeTask-b4yKCgjI7DEeqndl, etc.), T_CONTRAPARTIDAS en 18 nodos. Sin verificación
    de existencia/permisos, fallos aleatorios pueden interrumpir cadenas de proceso.'
  justification: 'Implementar PROC SQL checks al inicio (SELECT * FROM DICTIONARY.TABLES
    WHERE LIBNAME=''TABLAS'' AND MEMNAME=''BD_CTSI''), generar matriz de dependencias
    y documentar tabla-by-table en Wiki/README. Análisis: 62 tablas en 84 nodos totales
    = 74% dependencia de datos externos sin control.'
