- id: M-008
  category: reproducibility
  title: Verificar y documentar dependencias de bases de datos
  description: 'Se han detectado 4 librerías con estado no verificado (verified_db=false):
    (1) DCNIDATA (8 tablas, 4 nodos): AHORRO_PRE_0, AHORRO_PRE_1, DEUDA_HOGARES, DEUDA_HOLDING,
    FBCF_SF, SALDOS_WTW_SI, SALIDA_WTW_RESUMEN, SALIDA_WTW_RESUMEN_ANT; (2) GOBGENER
    (2 tablas, 1 nodo): CR18_T_SCN_2, EJECUCION; (3) LIB (1 tabla, 3 nodos): SERIES_OBS;
    (4) TABLAS (34 tablas, 62 nodos): BD_CTSI (20 nodos), T_CONTRAPARTIDAS (19 nodos),
    T_INSTRUMENTOS (21 nodos), T_SECTORIZACION (20 nodos), etc. Sin información de
    engine ni ubicación física.'
  justification: 'Las dependencias no verificadas generan fragilidad: ruptura silenciosa
    si tabla se remueve/renombra, dificultad en rastreo de impacto, y falta de gobernanza.
    Documentar schema (campos, tipos, restricciones), verificar existencia en CI/CD,
    y versionar cambios es crítico para reproducibilidad.'
  impact: high
  effort: high
  risk: medium
  recommendation: approve
  affected_nodes:
