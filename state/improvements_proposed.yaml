category_scan_summary:
  maintainability: 'Multiple critical issues identified: 43 hardcoded file paths (CS-0001
    through CS-0138), duplicated code blocks (8 fragments across 3-9 nodes each),
    6 critical complex nodes with LOC > 1400. Recommend: (1) Extract hardcoded paths
    to configuration/macro variables, (2) Refactor duplicated VBAR/VLINE/XAXIS visualization
    code into reusable macros, (3) Modularize high-complexity SQL procedures.'
  quality: '30 quality issues detected across nodes. Identified patterns: repeated
    CASE expressions (25 nodes for sign inversion logic, 16 for ''H'' handling, 8
    for account remapping), hardcoded magic numbers (27 instances of ''511'', 27 of
    ''321'', 24 of ''1000''). Recommend: Extract CASE logic to functions/macros, define
    numeric constants in centralized lookup table.'
  reproducibility: '31 reproducibility issues. Root causes: (1) Unverified database
    dependencies (DCNIDATA, GOBGENER, TABLAS with 34 tables, unverified engines),
    (2) 12 macro variables with inconsistent naming (ANIO vs anio, Sector, TRIM, Entrada),
    (3) Hardcoded credentials in nodes CodeTask-6NFJPkCu6mSpiJT9, CodeTask-PctehnQmgLccQ4yN,
    CodeTask-rVgcAFrUWf36VVj6. Recommend: Version control database schema, externalize
    all credentials to secure config, document all macro variables in single registry.'
