- id: M-003
  category: quality
  title: Extraer expresiones CASE replicadas a funciones/macros SAS
  description: 'Se han identificado 6 expresiones CASE altamente duplicadas: (1) ''CASE
    WHEN T1.C_ENTRADA=''D'' THEN T1.DATO*-1 ELSE T1.DATO END'' se repite en 25 nodos
    (CodeTask-2Qnp37e99kvQSM9m, CodeTask-6SjSzoc2tRAmj3bg, ... CodeTask-zVjjleFBA72oSeFU);
    (2) ''CASE WHEN T1.C_ENTRADA=''H'' THEN T1.DATO*-1 ELSE T1.DATO END'' aparece
    16 veces; (3) ''CASE WHEN T1.C_CUENTA=''REC PRECIO REAJ'' THEN ''REC PRECIO''
    ELSE T1.C_CUENTA END'' aparece 8 veces; (4) ''CASE WHEN T1.SECTOR=51022 THEN ''53''
    ELSE LEFT(PUT(T2.C_SI_PUBL,CHAR4.)) END'' aparece 6 veces.'
  justification: La duplicación de lógica de negocio aumenta el riesgo de bugs en
    mantenimiento (cambios inconsistentes). Extraer a una macro %SIGN_FLIP o función
    equivalente centraliza la lógica, facilita testing y versioning, y reduce complejidad
    ciclomática.
  impact: high
  effort: medium
  risk: medium
  recommendation: approve
