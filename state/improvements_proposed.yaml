- id: M-004
  category: reproducibility
  title: Centralizar y validar variables macro (ANIO, Sector, TRIM) con valores por
    defecto y documentación
  description: 'Se detectaron 11 variables macro utilizadas sin validación clara:
    ANIO (18 nodos), Sector (9 nodos), TRIM (6 nodos), Entrada (4), C_WTW (4), user
    (3), password (3), Codigo (3), Cuenta (2), rho (1), anio (1). Ejemplo: &ANIO usado
    en CodeTask-2Qnp37e99kvQSM9m, CodeTask-LbbQOdnOflsfHI1p, ..., CodeTask-vLMl6RS3eEI64niZ
    sin validación de rango. Esto introduce variabilidad y dificulta reproducción
    de runs anteriores.'
  justification: 'Implementar %LET con valores por defecto en autoexec, validación
    explícita (ej. %IF &ANIO < 2000 OR &ANIO > %SYSFUNC(YEAR(%TODAY())) %THEN %ABORT;)
    y logging de parámetros garantiza auditoría y reproducibilidad. Análisis: 11 macros
    en 62 nodos = alto riesgo de propagación de errores.'
  impact: high
  effort: medium
  risk: low
  recommendation: approve
  affected_nodes:
