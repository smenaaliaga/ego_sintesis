- id: M-002
  category: maintainability
  title: Refactorizar bloques de código duplicados en visualizaciones (PROC GPLOT/SGPLOT)
  description: 'Se han detectado 8 fragmentos de código duplicados con 3-9 occurrencias
    cada uno. Los más críticos: (1) ''SYMBOL1 INTERPOL=JOIN HEIGHT=10PT VALUE=NONE
    LINE=1 WIDTH=2 CV=BLACK'' aparece 3 veces en CodeTask-Ns4cmh4hITlllpAk, CodeTask-TkgG8t5JCMJVDoVb,
    CodeTask-ie1zFOWtqc6EvbAr; (2) ''VLINE PERIODO / RESPONSE=ANTERIOR'' aparece 3
    veces en los mismos nodos; (3) ''LEGEND1 FRAME CBORDER=WHITE'' aparece 3 veces
    en CodeTask-KbHRFnaoSR2Bq6wI, CodeTask-R47QCuhcMSIJeuMG, CodeTask-mCE2amv2UM7gUEki.'
  justification: La duplicación de definiciones de símbolos, líneas y leyendas gráficas
    aumenta la complejidad y el riesgo de inconsistencias visuales. Un cambio en formato
    de línea requiere editar múltiples nodos. Encapsular en macros SAS (ej. %SYMBOL_DEF,
    %LEGEND_DEF) reduce mantenimiento y facilita actualizaciones globales.
  impact: medium
  effort: medium
  risk: low
  recommendation: approve
  affected_nodes:
  - CodeTask-Ns4cmh4hITlllpAk
  - CodeTask-TkgG8t5JCMJVDoVb
