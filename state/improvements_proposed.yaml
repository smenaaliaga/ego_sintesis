- id: M-002
  category: maintainability
  title: Refactorizar bloques duplicados de código SAS (SYMBOL, VLINE, VBAR, LEGEND,
    UPDATE statements)
  description: 'Se identificaron 8 fragmentos de código idénticos o muy similares
    replicados en 3+ nodos: 1) ''SYMBOL1 INTERPOL=JOIN...'' (3 nodos: CodeTask-Ns4cmh4hITlllpAk,
    CodeTask-TkgG8t5JCMJVDoVb, CodeTask-ie1zFOWtqc6EvbAr), 2) ''VLINE PERIODO / RESPONSE=ANTERIOR...''
    (3 nodos), 3) ''SYMBOL2 INTERPOL=JOIN...'' (CodeTask-KbHRFnaoSR2Bq6wI, CodeTask-R47QCuhcMSIJeuMG,
    CodeTask-mCE2amv2UM7gUEki), 4) ''LEGEND1 FRAME...'' (3 nodos), 5) ''UPDATE SALDOS_SI
    SET N_SI_C_AGENTE...'' (CodeTask-Lf2OAAam1xLYVxj4, CodeTask-PTl7dbnx3tB9LNaa,
    CodeTask-vLMl6RS3eEI64niZ). Esta duplicación incrementa complejidad de mantenimiento
    y riesgo de inconsistencias.'
  justification: 'Refactorizar en macros SAS (%MACRO graph_config(), %MACRO update_saldos())
    o en programas compartidos reduce LOC, facilita cambios centralizados y mejora
    quality. Análisis: 8 bloques duplicados = 8 puntos de sincronización manual.'
  impact: medium
  effort: medium
  risk: low
  recommendation: approve
  affected_nodes:
